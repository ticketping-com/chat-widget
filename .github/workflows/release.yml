name: Release

on:
  push:
    tags: ['@ticketping/chat-widget@2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. @ticketping/chat-widget@2.0.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tag matches package version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./packages/widget/package.json').version")
          test "$TAG" = "@ticketping/chat-widget@$version" || { echo "::error::$TAG does not match $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node --test deploy/cdn/src/headers.test.ts
      - name: Build and size budgets
        run: npm run size

      - name: Require a local npm publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! npm view "@ticketping/chat-widget@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$VERSION is not on npm. Publish it locally, then re-run this workflow."
            exit 1
          fi

      - name: Upload to widget.ticketping.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/cdn/upload.ts

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSI "https://widget.ticketping.com/v2/$VERSION/widget.js" | grep -i 'cache-control: .*immutable'
          curl -fsS "https://widget.ticketping.com/v2/$VERSION/manifest.json"
