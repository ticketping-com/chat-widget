name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: CDN worker tests
        run: node --test deploy/cdn/src/headers.test.ts
      - name: Token test vectors are up to date
        run: npm run spec:vectors && git diff --exit-code spec/token-test-vectors.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Token-route examples pass the test vectors
        run: |
          npm ci --prefix examples/token-routes
          pip install -r examples/token-routes/requirements.txt
          gem install --user-install --no-document jwt
          npm run examples:check
      - name: Build and size budgets
        run: npm run size
